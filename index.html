function makePubTrack(context){

}

document.querySelector('.open-boz').src=ART_ASSETS['boz.ready'].src;
const titleHotel=decodeURIComponent(ART_ASSETS['hotel.base'].src.split(',')[1]).replace('</svg>','<g><path d="M1034 374h68v116h-68Z" fill="#274a4d"/><path d="M1042 382h52v108h-52Z" fill="#cba274"/><path d="M1068 382v108" stroke="#806b50" stroke-width="3"/><circle cx="1076" cy="442" r="3" fill="#ffe1a0"/><path d="M923 383h72v63h-72ZM1119 383h35v63h-35Z" fill="#5a7c81" stroke="#fff0ce" stroke-width="4"/></g></svg>');
document.querySelector('.open-hotel').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(titleHotel);
document.querySelector('.open-fountain').src=ART_ASSETS['fountain.bens'].src;
function startPresentation(){
 if(presentationStarted)return;presentationStarted=true;
 pubMusic.start();
 gameMain.inert=false;gameMain.removeAttribute('aria-hidden');
 opening.classList.add('departing');playButton.disabled=true;
 requestAnimationFrame(frame);
 setTimeout(()=>{opening.hidden=true;canvas.focus({preventScroll:true})},180);
}
playButton.addEventListener('click',startPresentation);
musicButton.addEventListener('click',()=>{
 pubMusic.muted=!pubMusic.muted;
 musicButton.setAttribute('aria-pressed',String(pubMusic.muted));musicButton.setAttribute('aria-label',pubMusic.muted?'Unmute music':'Mute music');
 musicButton.textContent=pubMusic.muted?'♫ MUTED':'♫ MUSIC';
 if(presentationStarted&&!pubMusic.muted)pubMusic.start();else pubMusic.volume();
});

</script></body></html>
